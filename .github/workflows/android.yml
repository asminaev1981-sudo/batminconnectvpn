name: Batmin Connect Android

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Flutter Gradle wrapper
        shell: bash
        run: |
          set -euxo pipefail
          if [[ ! -f android/gradlew || ! -f android/gradle/wrapper/gradle-wrapper.properties ]]; then
            WRAPPER_SEED="$(mktemp -d)"
            flutter create --platforms=android --project-name=batmin_wrapper_seed "$WRAPPER_SEED"
            cp "$WRAPPER_SEED/android/gradlew" android/gradlew
            cp "$WRAPPER_SEED/android/gradlew.bat" android/gradlew.bat
            mkdir -p android/gradle/wrapper
            cp "$WRAPPER_SEED/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/
            cp "$WRAPPER_SEED/android/gradle/wrapper/gradle-wrapper.properties" android/gradle/wrapper/
          fi
          chmod +x android/gradlew
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter diagnostics
        run: flutter doctor -v

      - name: Install compatible SagerNet gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" init
          "$(go env GOPATH)/bin/gomobile" help bind | head -40

      - name: Pin gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          gomobile init
          gomobile version || true

      - name: Build native libbox engine
        run: ./scripts/build_libbox_android.sh

      - name: Inspect native API
        run: ./scripts/inspect_libbox_aar.sh | tee libbox-api-report.txt

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --verbose

      - name: Unit tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify release inputs
        run: ./scripts/verify_release.sh

      - name: Package test release
        run: ./scripts/package_android_release.sh debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: batmin-connect-debug-arm64
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            dist/*.zip
            dist/*.sha256
            libbox-api-report.txt
          if-no-files-found: error
          retention-days: 14
